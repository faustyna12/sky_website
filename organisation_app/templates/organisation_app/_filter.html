<aside style="width: 280px; background: white; border-right: 1px solid #e1e8ed; padding: 25px; display: flex; flex-direction: column; height: 100vh;">
    
    <style>
        .filter-label { display: block; font-size: 11px; font-weight: 700; color: #88929b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .sky-select { width: 100%; padding: 10px; border: 1px solid #dcdde1; border-radius: 6px; color: #2c3e50; background-color: white; font-size: 13px; margin-bottom: 20px; outline: none; }
        /* Removed margin-top: auto to close the gap */
        .stats-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-top: 20px; } 
        .stats-label { font-size: 10px; color: #a4b0be; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .stats-value { font-size: 24px; color: #2c3e50; font-weight: 700; }
        .reset-btn { display: block; width: 100%; padding: 10px; background: white; border: 1px solid #eee; color: #88929b; border-radius: 6px; text-align: center; text-decoration: none; font-size: 12px; }
    </style>

    <div style="margin-bottom: 30px;">
        <h2 style="font-size: 16px; font-weight: 700; color: #2c3e50; margin: 0;">Filters</h2>
    </div>

    <form method="GET" action="{% url 'org_map' %}">
        <label class="filter-label">Department</label>
        <select name="department" onchange="this.form.submit()" class="sky-select">
            <option value="all">All Departments</option>
            {% for dept in departments_list %}
                <option value="{{ dept.id }}" {% if selected_dept == dept.id|stringformat:"s" %}selected{% endif %}>{{ dept.name }}</option>
            {% endfor %}
        </select>

        <label class="filter-label">Team Type</label>
        <select name="team_type" onchange="this.form.submit()" class="sky-select">
            <option value="all">All Types</option>
            {% for type in team_types %}
                <option value="{{ type.id }}" {% if selected_type == type.id|stringformat:"s" %}selected{% endif %}>{{ type.name }}</option>
            {% endfor %}
        </select>

        <label class="filter-label">Dependencies</label>
        <select name="dependencies" onchange="this.form.submit()" class="sky-select">
            <option value="all" {% if current_filter == 'all' %}selected{% endif %}>Show All Connections</option>
            <option value="upstream" {% if current_filter == 'upstream' %}selected{% endif %}>Upstream (Consumers)</option>
            <option value="downstream" {% if current_filter == 'downstream' %}selected{% endif %}>Downstream (Providers)</option>
        </select>

        <a href="{% url 'org_map' %}" class="reset-btn">Reset to Default</a>
    </form>

    <div class="stats-box">
        <div style="margin-bottom: 15px;">
            <div class="stats-label">Total Teams</div>
            <div class="stats-value">{{ total_teams }}</div>
        </div>
        <div>
            <div class="stats-label" style="color: #22aba4;">Active Dependencies</div>
            <div class="stats-value" style="color: #22aba4;">{{ total_deps }}</div>
        </div>
    </div>
    
    <div style="margin-top: auto; padding-top: 20px;">
        <p style="font-size: 10px; color: #cbd5e0; line-height: 1.4;">Use the filters to isolate team clusters and identify bottlenecks in Sky Streaming.</p>
    </div>
</aside>
