{% extends 'global.html' %}

{% block content %}
<style>
    /* Reuse your login page styling for consistency */
    nav, .navbar, .main-header { display: none !important; }

    .full-page-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: linear-gradient(135deg, #32a8a0 0%, #1a4d4a 45%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        z-index: 1000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .message-card {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        margin: auto;
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    .btn-back {
        display: inline-block;
        margin-top: 25px;
        color: #32a8a0;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        border: 2px solid #32a8a0;
        padding: 10px 25px;
        border-radius: 8px;
        transition: 0.3s;
    }

    .btn-back:hover {
        background: #32a8a0;
        color: white;
    }
</style>

<div class="full-page-bg">
    <div class="message-card">
        <div style="font-size: 40px; margin-bottom: 20px;">🛡️</div>
        <h1 style="color: #1e293b; font-size: 24px; margin-bottom: 10px;">Security Protocol</h1>
        <p style="color: #64748b; line-height: 1.6; font-size: 15px;">
            For your security, automated password resets are disabled. 
            <br><br>
            Please <strong>contact your Department Head</strong> or local System Administrator to reset your credentials.
        </p>
        
        <a href="{% url 'login' %}" class="btn-back">← Go Back to Login</a>
    </div>
</div>
{% endblock %}
