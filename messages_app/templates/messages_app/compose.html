{% extends 'messages_app/messages_base.html' %}

{% block title %}Compose{% endblock %}

{% block messages_content %}

<style>
.compose-panel {
    width: 100%;
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    border: 1px solid #dbe4ee;
}

.compose-header {
    height: 120px;
    display: flex;
    align-items: center;
    padding: 0 30px;
    background: linear-gradient(135deg, #22aba4, #0f766e);
    color: white;
}

.compose-header h2 {
    margin: 0;
    font-size: 2rem;
    font-weight: 800;
}

.compose-body {
    padding: 30px;
}

.form-group {
    margin-bottom: 18px;
}

.form-label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    color: #111827;
}

.recipient-box,
.form-control {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 14px;
    padding: 14px;
    background: #f8fafc;
}

.form-control {
    background: white;
    font-size: 15px;
}

textarea.form-control {
    min-height: 230px;
    resize: vertical;
}

.actions {
    display: flex;
    gap: 12px;
    margin-top: 10px;
}

.send-btn,
.draft-btn {
    min-width: 150px;
    border-radius: 12px;
    padding: 11px 18px;
    font-weight: 700;
    cursor: pointer;
}

.send-btn {
    background: #0f766e;
    color: white;
    border: none;
}

.draft-btn {
    background: white;
    color: #0f766e;
    border: 1px solid #0f766e;
}
</style>

<div class="compose-panel">
    <div class="compose-header">
        <h2>Compose Message</h2>
    </div>

    <div class="compose-body">
        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Recipients <span style="color:red;">*</span></label>

                <div class="recipient-box">
                    {% for user in users %}
                    <div>
                        <input type="checkbox" name="recipient" value="{{ user.id }}" id="user{{ user.id }}">
                        <label for="user{{ user.id }}">{{ user.username }}</label>
                    </div>
                    {% empty %}
                    <span>No users available</span>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Subject</label>
                <input type="text" name="subject" class="form-control" placeholder="Enter subject">
            </div>

            <div class="form-group">
                <label class="form-label">Message <span style="color:red;">*</span></label>
                <textarea name="body" class="form-control" placeholder="Write your message here..."></textarea>
            </div>

            <div class="actions">
                <button type="submit" name="status" value="sent" class="send-btn">Send</button>
                <button type="submit" name="status" value="draft" class="draft-btn">Save Draft</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
