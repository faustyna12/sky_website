<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenSky | Support</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg { 
            background: linear-gradient(135deg, #32a8a0 0%, #1a4d4a 45%, #0f172a 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; box-sizing: border-box;
        }
        .card { 
            background: white; width: 100%; max-width: 800px; padding: 50px; border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        h1 { color: #32a8a0; margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #32a8a0; text-decoration: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; text-align: left; }
    </style>
</head>
<body>
    <div class="bg">
        <div class="card">
            <a href="javascript:void(0)" onclick="smartBack()" class="btn-back">← Go Back</a>

<script>
    function smartBack() {
        // If there's a previous page in history, go there. 
        // Otherwise, default to the login page.
        if (document.referrer) {
            window.history.back();
        } else {
            window.location.href = "/login/";
        }
    }
</script>
            <h1>Global Support Center</h1>
            <p><strong>AOG Technical Support (24/7):</strong> +44 20 7946 0888</p>
            <p><strong>General IT Inquiries:</strong> +44 20 7946 0111</p>
            <h3>Service Hours</h3>
            <table>
                <tr style="background: #f8fafc;"><th>Department</th><th>Hours</th></tr>
                <tr><td>Technical Support</td><td>24/7</td></tr>
                <tr><td>Admin Office</td><td>08:00 - 18:00 GMT</td></tr>
            </table>
        </div>
    </div>
</body>
</html>
